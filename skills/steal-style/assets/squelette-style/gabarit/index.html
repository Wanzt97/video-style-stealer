<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Gabarit — démonstration</title>
    <!--
      LA DÉMONSTRATION. Elle enchaîne les modèles de scène entre des blocs visage, comme un vrai montage.
      Les règles viennent de FICHE.md ; ce fichier ne contient aucune durée d'animation.

      Dans un vrai montage :
        1. remplacer le bloc #visage par la vidéo des rushs coupés (<video id="voix" src="voix.mp4" …>) ;
        2. mettre la durée réelle dans data-duration ;
        3. poser un host par scène animée, aux temps du storyboard ;
        4. lister les blocs visage dans BLOCS_VISAGE.
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="lib/jetons.js"></script>
    <script src="lib/moteur.js"></script>
    <link rel="stylesheet" href="lib/habillage.css">
    <style>
      body { margin: 0; background: #000; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #visage { position: absolute; inset: 0; background: #1c1c1c; display: grid; place-items: center; }
      .scene { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="14">
      <!-- LE VISAGE. La voix joue en continu sous tout le reste ; les scènes animées la recouvrent. -->
      <div id="visage"><p class="technique" data-layout-ignore="">Visage · remplacer par les rushs coupés</p></div>

      <!-- LES SCÈNES ANIMÉES. Plein cadre, au-dessus du visage. -->
      <div id="el-m00" class="scene" data-composition-id="m00" data-composition-src="compositions/m00-exemple.html"
           data-start="3" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
    </div>

    <script>
      // Chaque bloc visage : [début, fin] en secondes de montage.
      const BLOCS_VISAGE = [[0, 3], [11, 14]];

      const tl = gsap.timeline({ paused: true });
      Moteur.visage(tl, "#visage", BLOCS_VISAGE);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
